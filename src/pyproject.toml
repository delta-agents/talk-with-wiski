[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "AI_agents_template/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["AI_agents_template"]

[project]
name = "AI_agents_template"
version = "0.0.1"
description = "Python package template"
readme = "README.md"
license = {text = "GNU-GPL V3"}
authors = [
  { name = "Guy Dupuits"},
  { name = "David Haasnoot"},
]

dependencies = [
  "python-dotenv",
  "openai",
  "pydantic",
  "pydantic-ai",
  "streamlit",
  "pytest",
  "pytest-asyncio",
]

[project.urls]
Documentation = "https://hkv-products-services.github.io/AI_agents_template"
Source = "https://github.com/HKV-products-services/AI_agents_template"
