[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "talk_with_wiski/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["talk_with_wiski"]

[workspace]
name = "talk_with_wiski"
version = "0.0.1"
description = "Python package template"
readme = "README.md"
license = {text = "GNU-GPL V3"}
authors = [
  { name = "Guy Dupuits"},
  { name = "David Haasnoot"},
]

dependencies = [
  "python-dotenv",
  "openai",
  "pydantic",
  "pydantic-ai",
  "streamlit",
  "pytest",
  "pytest-asyncio",
]

[project.urls]
Documentation = "https://hkv-products-services.github.io/talk_with_wiski"
Source = "https://github.com/HKV-products-services/talk_with_wiski"
