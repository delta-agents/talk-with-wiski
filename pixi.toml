[project]
name = "AI_agents_template"
version = "0.0.1"
description = "AI agents"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "win-64", "linux-64"]
readme = "README.md"
license = "GPL-3.0"
license-file = "LICENSE"

[tasks]
# Installation
install = "pre-commit install"
start = { cmd = "uvicorn main:app --host 0.0.0.0 --port 8000" }

# run scripts
#script = { cmd = "python scipts.py", cwd = "scripts" }

# Docs
quartodoc-build = { cmd = "quartodoc build && rm objects.json", cwd = "docs" ,inputs = [
    "docs/_quarto.yml",
    "src/AI_agents_template",
    ],outputs = [
    "docs/reference/"
    ]}
quarto-preview = { cmd = "export QUARTO_PYTHON=python && quarto preview docs", depends-on = [
    "quartodoc-build",
] }
quarto-check = { cmd = "quarto check all", depends-on = ["quartodoc-build"] }
quarto-render = { cmd = "export QUARTO_PYTHON=python && quarto render docs --to html --execute", depends-on = [
    "quartodoc-build",
] }
docs = { depends-on = ["quarto-preview"] }
pre-commit = "pre-commit run --all-files"

test = "pytest"

[tool.ruff]
# Ruff configuration, see https://docs.astral.sh/ruff/configuration/
# lint.ignore = [
    # "E402",   # module not at top of py file
    #"E501",  # Line too long
    #"F401",  # Unused import
    #"F403",  # 'from module import *' used; unable to detect undefined names
    #"F405",  # Name may be undefined, or defined from star imports: module
    #"F841",  # Local variable name is assigned to but never used
    #"T201",  # Use of print statement (use print() function instead)
# ]

[dependencies]
python = ">=3.11"
ipykernel = ">=6.29.5,<7"
ipywidgets ="*"
nbclient ="*"
nbformat ="*"
pre-commit = "*"
pytest-cov = "*"
quarto = ">=1.5.57"
quartodoc = ">=0.9.1"
ruff = ">=0.8.1"
tqdm = "*"
python-dotenv = ">=1.0.1"
openai = ">=1.12.0"
pydantic = ">=2.0.0"
pytest = ">=8.4.1,<9"
pytest-asyncio = ">=1.0.0,<2"
matplotlib = ">=3.10.3,<4"
fastapi = ">=0.115.14,<0.116"
fastmcp = ">=2.10.2,<3"
duckdb = ">=1.3.2,<2"
geopandas = ">=1.1.1,<2"
xmlschema = ">=4.1.0,<5"
requests = ">=2.31.0,<3"
beautifulsoup4 = ">=4.12.0,<5"
pip = ">=25.1.1,<26"
lxml = ">=6.0.0,<7"
html5lib = ">=1.1,<2"
pydantic-ai = ">=0.2"
nodejs = ">=24.4.1,<24.5"

[pypi-dependencies]
AI_agents_template = { path = "src", editable = true }
